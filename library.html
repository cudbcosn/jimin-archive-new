<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F3EF">

  <title>JIMIN AUDIO ARCHIVE | 声音收藏馆</title>

  <style>
    :root {
      --bg: #F5F3EF;
      --white: #FFFEFA;
      --text: #302D2A;
      --muted: #89837B;
      --line: #DED9D1;
      --accent: #A58B73;
      --soft: #E8DFD3;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 22px 60px;
    }

    /* 顶部导航栏 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      flex-shrink: 0;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 圆角导航按钮 */
    nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      transition: background 0.2s ease,
                  border-color 0.2s ease,
                  color 0.2s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--text);
    }

    /* 当前页面按钮 */
    nav a.current {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--text);
    }

    /* 声音档案标题 */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 38px 0 20px;
    }

    .section-title h2 {
      margin: 0;
      color: var(--text);
      font-size: 23px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #totalCount {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    /* 音频列表 */
    #audioList {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .audio-item {
      display: flex;
      align-items: center;
      gap: 17px;
      min-height: 84px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      transition: border-color 0.2s ease,
                  transform 0.2s ease,
                  background 0.2s ease;
    }

    .audio-item:hover {
      border-color: var(--accent);
      background: #FFFFFF;
      transform: translateY(-2px);
    }

    .item-number {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
    }

    .item-date {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .arrow {
      flex-shrink: 0;
      color: var(--accent);
      font-size: 19px;
      transition: transform 0.2s ease;
    }

    .audio-item:hover .arrow {
      transform: translate(2px, -2px);
    }

    /* 页脚 */
    .footer {
      margin-top: 54px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: 1px;
      text-align: center;
    }

    .footer-note {
      margin-top: 10px;
      font-size: 10px;
      line-height: 2;
      letter-spacing: 0;
    }

    /* 手机端适配 */
    @media (max-width: 520px) {
      .container {
        padding-right: 18px;
        padding-left: 18px;
      }

      header {
        gap: 8px;
        padding: 18px 0;
      }

      .brand {
        font-size: 10px;
        letter-spacing: 1px;
      }

      nav {
        gap: 6px;
      }

      nav a {
        min-height: 32px;
        padding: 7px 10px;
        font-size: 10px;
      }

      .section-title {
        margin-top: 32px;
        margin-bottom: 17px;
      }

      .section-title h2 {
        font-size: 21px;
      }

      .audio-item {
        gap: 12px;
        min-height: 76px;
        padding: 15px;
      }

      .item-number {
        width: 34px;
        height: 34px;
        font-size: 10px;
      }

      .item-title {
        font-size: 13px;
      }

      .footer {
        margin-top: 42px;
      }

      .footer-note {
        font-size: 10px;
      }
    }

    /* 更窄的手机屏幕 */
    @media (max-width: 360px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- 顶部导航栏 -->
    <header>
      <a class="brand" href=" ">JIMIN ARCHIVE</a >

      <nav>
        <a href="./index.html">首页</a >
        <a href="./videos.html">视频收藏馆</a >
      </nav>
    </header>

    <!-- 声音档案列表 -->
    <section>
      <div class="section-title">
        <h2>声音档案</h2>
        <span id="totalCount">03 RECORDS</span>
      </div>

      <div id="audioList"></div>
    </section>

    <!-- 版权说明 -->
    <footer class="footer">
      JIMIN AUDIO ARCHIVE
      <div class="footer-note">
        本页面音频版权归属官方，仅作为旻吧回忆录配套网页观赏使用<br>
        网页权限仅限购买者本人私人观看，严禁二次传播
      </div>
    </footer>

  </main>

  <script>
    const AUDIO_LIST = [
      {
        id: "001",
        title: "智旻自创rap",
        file: "jimin.mp3",
        date: "2013"
      },
      {
        id: "002",
        title: "智旻发来图书馆邀请",
        file: "audio002.mp3",
        date: "2013"
      },
      {
        id: "003",
        title: "excuse me",
        file: "audio003.mp3",
        date: "2014"
      }
    ];

    const list = document.getElementById("audioList");

    document.getElementById("totalCount").textContent =
      String(AUDIO_LIST.length).padStart(2, "0") + " RECORDS";

    AUDIO_LIST.forEach(function (audio) {
      const link = document.createElement("a");

      link.className = "audio-item";
      link.href =
        "./player.html?id=" +
        encodeURIComponent(audio.id) +
        "&refresh=1013";

      const number = document.createElement("div");
      number.className = "item-number";
      number.textContent = audio.id;

      const content = document.createElement("div");
      content.className = "item-content";

      const title = document.createElement("div");
      title.className = "item-title";
      title.textContent = audio.title;

      const date = document.createElement("div");
      date.className = "item-date";
      date.textContent = audio.date;

      content.appendChild(title);
      content.appendChild(date);

      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.textContent = "↗";

      link.appendChild(number);
      link.appendChild(content);
      link.appendChild(arrow);

      list.appendChild(link);
    });
  </script>
</body>
</html>
