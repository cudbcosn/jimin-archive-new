<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>女团舞 | JIMIN ARCHIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      background: #F5F3EF;
      color: #302D2A;
      font-family: -apple-system, BlinkMacSystemFont,
        "PingFang SC", sans-serif;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      margin: 12px 0;
      font-size: 24px;
      font-weight: 500;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 24px;
      color: #89837B;
      font-size: 12px;
      text-align: center;
      letter-spacing: 1px;
    }

    .video-box {
      width: 100%;
      overflow: hidden;
      border-radius: 4px;
      background: #171513;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #171513;
    }

    .message {
      margin-top: 14px;
      color: #89837B;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 24px auto 0;
      padding: 12px 22px;
      border: 1px solid #DED9D1;
      border-radius: 24px;
      background: #FFFEFA;
      color: #A58B73;
      font-size: 13px;
      text-decoration: none;
      text-align: center;
    }

    .back:active {
      background: #E8DFD3;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>女团舞</h1>

    <div class="subtitle">
      JIMIN ARCHIVE · VIDEO COLLECTION
    </div>

    <div class="video-box">
      <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
      >
        <source
          src="https://cudbcosn.github.io/jimin-archive-new/%E5%A5%B3%E5%9B%A2%E8%88%9E.mp4"
          type="video/mp4"
        >

        当前浏览器不支持播放此视频。
      </video>
    </div>

    <div class="message" id="message">
      如果视频没有自动播放，请点击播放器中的播放按钮。
    </div>

    <a
      class="back"
      href=" "
    >
      ← 返回视频收藏馆
    </a >
  </main>

  <script>
    const video = document.getElementById("video");
    const message = document.getElementById("message");

    video.addEventListener("error", function () {
      message.textContent =
        "视频加载失败。请检查文件地址或视频编码格式。";
    });

    video.addEventListener("loadedmetadata", function () {
      message.textContent =
        "视频已加载，请点击播放按钮观看。";
    });
  </script>
</body>
</html>
