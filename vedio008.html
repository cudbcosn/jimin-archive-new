<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偶像本色 | JIMIN ARCHIVE</title>
  <style>
    :root {
      --bg: #F5F3EF;
      --white: #FFFEFA;
      --text: #302D2A;
      --muted: #89837B;
      --line: #DED9D1;
      --accent: #A58B73;
      --soft: #E8DFD3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 18px 50px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      padding: 28px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .back {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .back:hover {
      color: var(--accent);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .video-section {
      padding-top: 28px;
    }

    .video-title {
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 16px;
    }

    .video-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #211f1c;
      border-radius: 10px;
      overflow: hidden;
    }

    .video-player video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #211f1c;
    }

    .video-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .video-button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--muted);
      border-radius: 30px;
      padding: 10px 19px;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .video-button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .video-button:active {
      transform: scale(.97);
    }

    .description {
      margin-top: 22px;
      padding: 17px 18px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    footer {
      margin-top: 45px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <a class="back" href=" ">← 返回视频收藏馆</a >
      <div class="eyebrow">JIMIN ARCHIVE</div>
      <h1>偶像本色</h1>
      <div class="subtitle">那些可爱又特别的瞬间</div>
    </header>

    <main class="video-section">
      <h2 class="video-title" id="currentTitle">大家嚎</h2>

      <div class="video-player">
        <video
          id="videoPlayer"
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
        >
          <source src="./大家嚎.mp4" type="video/mp4">
          你的浏览器暂不支持视频播放。
        </video>
      </div>

      <div class="video-buttons">
        <button class="video-button active" data-index="0">大家嚎</button>
        <button class="video-button" data-index="1">学习中文</button>
        <button class="video-button" data-index="2">祝你好运</button>
      </div>

      <div class="description">
        收藏朴智旻那些让人忍不住反复观看的可爱瞬间。
      </div>
    </main>

    <footer>
      JIMIN ARCHIVE · FOR PARK JIMIN
    </footer>

  </div>

  <script>
    const videos = [
      {
        title: "大家嚎",
        url: "./大家嚎.mp4"
      },
      {
        title: "学习中文",
        url: "./学习中文.mp4"
      },
      {
        title: "祝你好运",
        url: "./祝你好运.mp4"
      }
    ];

    const player = document.getElementById("videoPlayer");
    const currentTitle = document.getElementById("currentTitle");
    const buttons = document.querySelectorAll(".video-button");

    function playVideo(index) {
      const video = videos[index];

      if (!video) return;

      player.pause();
      player.src = video.url;
      player.load();

      currentTitle.textContent = video.title;

      buttons.forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      player.play().catch(() => {
        // iPhone 等设备可能需要用户手动点击播放
      });
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        playVideo(Number(button.dataset.index));
      });
    });
  </script>
</body>
</html>
