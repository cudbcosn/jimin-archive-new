<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频收藏馆 | JIMIN ARCHIVE</title>

<style>
:root {
  --bg: #F5F3EF;
  --white: #FFFEFA;
  --text: #302D2A;
  --muted: #89837B;
  --line: #DED9D1;
  --accent: #A58B73;
  --soft: #E8DFD3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Microsoft YaHei", sans-serif;
}

body.modal-open {
  overflow: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

.page {
  max-width: 850px;
  margin: auto;
  padding: 0 22px 40px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
}

.brand {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

nav a {
  color: var(--muted);
  font-size: 12px;
}

nav a:hover {
  color: var(--accent);
}

.hero {
  padding: 48px 0 32px;
  text-align: center;
}

.eyebrow {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 3px;
}

h1 {
  margin: 12px 0;
  font-size: 32px;
  font-weight: 500;
  letter-spacing: 3px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 1px;
}

.divider {
  width: 35px;
  height: 1px;
  margin: 22px auto 0;
  background: var(--accent);
}

.filter-title {
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

.filters {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}

.filter {
  padding: 7px 16px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--white);
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
}

.filter.active {
  background: var(--soft);
  border-color: var(--soft);
  color: var(--text);
}

.list-info {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.video-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--white);
  box-shadow: 0 5px 20px rgba(70, 55, 40, 0.04);
}

.cover {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0;
  overflow: hidden;
  border: 0;
  background: linear-gradient(135deg, #F0ECE5, #E8DFD3);
  aspect-ratio: 16 / 9;
  cursor: pointer;
}

.cover img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.placeholder {
  color: var(--accent);
  text-align: center;
}

.placeholder-symbol {
  font-family: Georgia, serif;
  font-size: 36px;
}

.placeholder-text {
  margin-top: 5px;
  font-size: 10px;
  letter-spacing: 2px;
}

.play {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 254, 250, 0.92);
  color: var(--accent);
  transform: translate(-50%, -50%);
}

.video-info {
  padding: 14px;
}

.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.tag {
  padding: 3px 8px;
  background: #F0ECE5;
  color: var(--accent);
  font-size: 10px;
}

.date {
  color: var(--muted);
  font-size: 10px;
}

.video-title {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
}

.description {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 13px;
  padding-top: 10px;
  border-top: 1px solid #EEEAE4;
  color: var(--accent);
  font-size: 11px;
}

.empty {
  display: none;
  padding: 35px 15px;
  border: 1px dashed var(--line);
  color: var(--muted);
  text-align: center;
  font-size: 12px;
}

.note {
  margin-top: 30px;
  padding: 20px 14px;
  border: 1px solid var(--line);
  background: rgba(255, 254, 250, 0.65);
  text-align: center;
}

.note-title {
  color: var(--accent);
  font-size: 11px;
  letter-spacing: 2px;
}

.note p {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 2;
}

footer {
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 10px;
  text-align: center;
  line-height: 2;
  letter-spacing: 1px;
}

footer strong {
  display: block;
  color: var(--accent);
  font-family: Georgia, serif;
  font-size: 15px;
  font-weight: normal;
  letter-spacing: 2px;
}

/* 播放窗口 */
.modal {
  position: fixed;
  z-index: 99;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(35, 31, 27, 0.86);
  overflow-y: auto;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 850px;
  max-height: 95vh;
  overflow-y: auto;
  background: var(--white);
}

.modal-header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 15px;
  border-bottom: 1px solid var(--line);
  background: var(--white);
}

.modal-title {
  font-size: 13px;
}

.close {
  flex-shrink: 0;
  border: 0;
  background: none;
  color: var(--text);
  font-size: 24px;
  cursor: pointer;
}

.video-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 14px;
  background: var(--white);
}

.video-choice {
  padding: 9px 15px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--white);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
}

.video-choice.active {
  border-color: var(--accent);
  background: var(--soft);
}

.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #171513;
}

.player video,
.player iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.modal-message {
  display: none;
  padding: 20px 15px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.modal-message.show {
  display: block;
}

.modal-message a {
  display: inline-block;
  margin-top: 8px;
  color: var(--accent);
  text-decoration: underline;
}

@media (max-width: 520px) {
  .page {
    padding-right: 15px;
    padding-left: 15px;
  }

  header {
    align-items: flex-start;
  }

  nav {
    justify-content: flex-end;
    gap: 10px;
  }

  nav a {
    font-size: 10px;
  }

  h1 {
    font-size: 27px;
  }

  .video-grid {
    gap: 12px;
  }

  .video-info {
    padding: 10px;
  }

  .video-title {
    font-size: 12px;
  }

  .description {
    font-size: 10px;
  }

  .date {
    font-size: 9px;
  }

  .filter {
    padding: 7px 12px;
  }

  .modal {
    padding: 10px;
  }
}

@media (max-width: 350px) {
  .video-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="page">

  <header>
    <a class="brand" href="./index.html">JIMIN ARCHIVE</a>

    <nav>
      <a href="./index.html">首页</a>
      <a href="./library.html">声音收藏馆</a>
    </nav>
  </header>

  <section class="hero">
    <div class="eyebrow">JIMIN · VIDEO ARCHIVE</div>
    <h1>视频收藏馆</h1>
    <div class="subtitle">收藏那些值得反复观看的瞬间</div>
    <div class="divider"></div>
  </section>

  <section>
    <div class="filter-title">按照喜欢的类型，寻找智旻的珍贵影像</div>

    <div class="filters">
      <button class="filter active" data-category="全部">全部</button>
      <button class="filter" data-category="舞台">舞台</button>
      <button class="filter" data-category="采访/综艺">采访/综艺</button>
      <button class="filter" data-category="幕后">幕后</button>
      <button class="filter" data-category="日常">日常</button>
      <button class="filter" data-category="其他">其他</button>
    </div>
  </section>

  <div class="list-info">
    <span>VIDEO COLLECTION</span>
    <span id="count">共 0 个收藏</span>
  </div>

  <main>
    <div class="video-grid" id="videoGrid"></div>
    <div class="empty" id="empty">这个分类暂时还没有收藏的视频。</div>
  </main>

  <section class="note">
    <div class="note-title">LITTLE MOMENTS, FOREVER</div>
    <p>
      每一段影像，都是值得收藏的回忆。<br>
      慢慢收集，慢慢整理，把喜欢的瞬间留在这里。
    </p>
  </section>

  <footer>
    <strong>JIMIN ARCHIVE</strong>
    <div>本页面视频版权归属官方，仅作为旻吧回忆录配套网页观赏使用</div>
    <div>网页权限仅限购买者本人私人观看，严禁二次传播</div>
  </footer>

</div>

<div class="modal" id="modal">
  <div class="modal-box">

    <div class="modal-header">
      <span class="modal-title" id="modalTitle">视频播放</span>
      <button class="close" id="close" aria-label="关闭">×</button>
    </div>

    <div class="video-selector" id="videoSelector" hidden></div>

    <div class="player" id="player"></div>

    <div class="modal-message" id="message"></div>

  </div>
</div>

<script>
/*
添加视频说明：

1. id：视频编号。
2. title：卡片标题。
3. date：视频日期。
4. category：舞台、采访/综艺、幕后、日常、其他。
5. cover：封面图片地址，没有封面就留空。
6. videos：视频列表，可以给一张卡片添加多个视频。
7. description：卡片简介。

视频文件放在仓库根目录时：
./女团舞.mp4
./邪恶版kiyo.mp4

注意：文件名必须与 GitHub 仓库中的真实文件名完全一致。
*/

const VIDEO_LIST = [
  {
    id: "001",
    title: "After School Club",
    date: "140827",
    category: "采访/综艺",
    cover: "./afterschool.png",
    videos: [
      {
        title: "女团舞",
        url: "./女团舞.mp4"
      },
      {
        title: "邪恶版kiyo",
        url: "./邪恶版kiyo.mp4"
      }
    ],
    description: "智旻在节目中的瞬间。"
  },
 {
  id: "002",
  title: "魅力担当智旻",
  date: "130725",
  category: "幕后",
  cover: "",
  videos: [
    {
      title: "魅力担当智旻",
      url: "./魅力担当.mp4"
    }
  ],
  description: "舞台之外，那些瞬间。"
},
  {
    id: "003",
    title: "镜头之外的智旻",
    date: "待补充",
    category: "幕后",
    cover: "",
    videos: [],
    description: "镜头前的真诚表达，也值得被好好记住。"
  }
];

const grid = document.getElementById("videoGrid");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const player = document.getElementById("player");
const message = document.getElementById("message");
const videoSelector = document.getElementById("videoSelector");

let currentCategory = "全部";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getVideoList(item) {
  if (Array.isArray(item.videos)) {
    return item.videos.filter(v => v && v.url);
  }

  if (item.video) {
    return [{ title: item.title, url: item.video }];
  }

  return [];
}

function renderVideos() {
  const list = currentCategory === "全部"
    ? VIDEO_LIST
    : VIDEO_LIST.filter(v => v.category === currentCategory);

  grid.innerHTML = list.map(v => {
    const videos = getVideoList(v);
    const videoLabel = videos.length
      ? `含 ${videos.length} 个视频`
      : "待添加视频";

    const coverHTML = v.cover
      ? `<img src="${escapeHTML(v.cover)}"
          alt="${escapeHTML(v.title)}"
          loading="lazy"
          onerror="this.style.display='none'">`
      : `<div class="placeholder">
          <div class="placeholder-symbol">J</div>
          <div class="placeholder-text">JIMIN ARCHIVE</div>
        </div>`;

    return `
      <article class="video-card">
        <button
          class="cover"
          data-id="${escapeHTML(v.id)}"
          aria-label="打开 ${escapeHTML(v.title)}">

          ${coverHTML}

          <span class="play">▶</span>
        </button>

        <div class="video-info">
          <div class="meta">
            <span class="tag">${escapeHTML(v.category)}</span>
            <span class="date">${escapeHTML(v.date)}</span>
          </div>

          <h2 class="video-title">${escapeHTML(v.title)}</h2>

          <p class="description">
            ${escapeHTML(v.description || "")}
          </p>

          <div class="card-footer">
            <span>${videoLabel}</span>
            <span>↗</span>
          </div>
        </div>
      </article>
    `;
  }).join("");

  count.textContent = `共 ${list.length} 个收藏`;
  empty.style.display = list.length ? "none" : "block";
  grid.style.display = list.length ? "grid" : "none";
}

function showMessage(text, url = "") {
  message.innerHTML = "";
  message.classList.add("show");

  const paragraph = document.createElement("div");
  paragraph.textContent = text;
  message.appendChild(paragraph);

  if (url) {
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "在新页面打开视频";
    message.appendChild(link);
  }
}

function clearPlayer() {
  player.innerHTML = "";
  message.innerHTML = "";
  message.classList.remove("show");
}

function getYouTubeEmbed(url) {
  try {
    const u = new URL(url, window.location.href);
    const host = u.hostname.replace(/^www\./, "");
    let id = "";

    if (host === "youtu.be") {
      id = u.pathname.split("/").filter(Boolean)[0] || "";
    } else if (
      ["youtube.com", "m.youtube.com", "youtube-nocookie.com"].includes(host)
    ) {
      if (u.pathname === "/watch") {
        id = u.searchParams.get("v") || "";
      } else {
        const match = u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);
        if (match) id = match[1];
      }
    }

    return id
      ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1`
      : null;
  } catch {
    return null;
  }
}

function playSelectedVideo(item) {
  clearPlayer();

  modalTitle.textContent = item.title || "视频播放";

  const url = String(item.url || "").trim();

  if (!url) {
    showMessage("这个视频还没有添加播放地址。");
    return;
  }

  const youtubeURL = getYouTubeEmbed(url);

  if (youtubeURL) {
    const iframe = document.createElement("iframe");
    iframe.src = youtubeURL;
    iframe.title = item.title || "视频播放";
    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;

    player.appendChild(iframe);
    return;
  }

  const video = document.createElement("video");

  video.controls = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  video.style.width = "100%";
  video.style.height = "100%";
  video.style.display = "block";
  video.style.background = "#171513";

  // 让浏览器根据地址加载视频。
  video.src = url;

  video.addEventListener("error", () => {
    showMessage(
      "视频加载失败。请检查文件名、视频地址或视频编码格式。",
      new URL(url, window.location.href).href
    );
  }, { once: true });

  player.appendChild(video);

  // 尝试自动播放；若手机浏览器阻止，仍可手动点击播放。
  const playPromise = video.play();

if (playPromise && typeof playPromise.catch === "function") {
  playPromise.catch(() => {
    // iPhone 可能会阻止自动播放，保留播放器供用户手动操作。
    message.classList.remove("show");
  });
}
}

function openVideo(v) {
  clearPlayer();

  modalTitle.textContent = v.title;
  modal.classList.add("open");
  document.body.classList.add("modal-open");

  const videos = getVideoList(v);

  if (!videos.length) {
    showMessage("这段视频还没有添加播放地址。");
    return;
  }

  if (videos.length > 1) {
    videoSelector.hidden = false;
    videoSelector.innerHTML = "";

    videos.forEach((item, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "video-choice";
      button.textContent = item.title || `视频 ${index + 1}`;

      button.addEventListener("click", () => {
        videoSelector.querySelectorAll(".video-choice").forEach(b => {
          b.classList.remove("active");
        });

        button.classList.add("active");
        playSelectedVideo(item);
      });

      videoSelector.appendChild(button);
    });

    // 默认选中并播放第一个视频。
    const firstButton = videoSelector.querySelector(".video-choice");
    if (firstButton) firstButton.classList.add("active");

    playSelectedVideo(videos[0]);
  } else {
    videoSelector.hidden = true;
    videoSelector.innerHTML = "";
    playSelectedVideo(videos[0]);
  }
}

function closeModal() {
  modal.classList.remove("open");
  document.body.classList.remove("modal-open");

  clearPlayer();
  videoSelector.innerHTML = "";
  videoSelector.hidden = true;
}

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");
    currentCategory = button.dataset.category;
    renderVideos();
  });
});

grid.addEventListener("click", event => {
  const button = event.target.closest("[data-id]");
  if (!button) return;

  const item = VIDEO_LIST.find(v => v.id === button.dataset.id);

  if (item) {
    openVideo(item);
  }
});

document.getElementById("close").addEventListener("click", closeModal);

modal.addEventListener("click", event => {
  if (event.target === modal) {
    closeModal();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
  }
});

renderVideos();
</script>

</body>
</html>
