<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>006 2015羊年祝福 | JIMIN ARCHIVE</title>

<style>

:root {
  --bg: #F5F3EF;
  --white: #FFFEFA;
  --text: #302D2A;
  --muted: #89837B;
  --line: #DED9D1;
  --accent: #A58B73;
  --soft: #E8DFD3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "PingFang SC", sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 0 20px 40px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
}

.brand {
  color: var(--text);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  text-decoration: none;
}

nav a {
  color: var(--muted);
  font-size: 12px;
  text-decoration: none;
}

.hero {
  padding: 45px 0 30px;
  text-align: center;
}

.eyebrow {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 3px;
}

h1 {
  margin: 15px 0;
  font-size: 27px;
  font-weight: 500;
  letter-spacing: 2px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.divider {
  width: 35px;
  height: 1px;
  margin: 22px auto;
  background: var(--accent);
}

.video-box {
  width: 100%;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #171513;
}

video {
  display: block;
  width: 100%;
  height: auto;
  max-height: 75vh;
  background: #171513;
}

.video-info {
  margin-top: 20px;
  padding: 18px;
  border: 1px solid var(--line);
  background: var(--white);
}

.video-date {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 2px;
}

.video-description {
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 2;
}

.message {
  margin-top: 15px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
}

.back {
  display: block;
  max-width: 280px;
  margin: 28px auto 0;
  padding: 14px 20px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--white);
  color: var(--accent);
  font-size: 13px;
  text-align: center;
  text-decoration: none;
}

.back:hover {
  background: var(--soft);
}

footer {
  margin-top: 35px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 10px;
  line-height: 2;
  text-align: center;
}

footer strong {
  display: block;
  margin-bottom: 8px;
  color: var(--accent);
  font-family: Georgia, serif;
  font-size: 15px;
  font-weight: normal;
  letter-spacing: 2px;
}

@media (max-width: 520px) {

  .container {
    padding-right: 15px;
    padding-left: 15px;
  }

  h1 {
    font-size: 23px;
  }

}

</style>
</head>

<body>

<div class="container">

  <header>

    <a class="brand" href="./index.html">
      JIMIN ARCHIVE
    </a>

    <nav>
      <a href="./videos.html">
        视频收藏馆
      </a>
    </nav>

  </header>

  <section class="hero">

    <div class="eyebrow">
      JIMIN · VIDEO ARCHIVE
    </div>

    <h1>
      2015羊年祝福
    </h1>

    <div class="subtitle">
      006 · VIDEO COLLECTION
    </div>

    <div class="divider"></div>

  </section>

  <!-- 视频播放器 -->

  <div class="video-box">

    <video
      id="video"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
    >

      <source
        src="./2015羊年祝福.mp4"
        type="video/mp4"
      >

      当前浏览器不支持播放此视频。

    </video>

  </div>

  <!-- 视频介绍 -->

  <section class="video-info">

    <div class="video-date">
      150101 · VIDEO 006
    </div>

    <div class="video-description">
      收藏那些值得反复观看的瞬间。<br>
      慢慢收集，慢慢整理，把喜欢的回忆留在这里。
    </div>

  </section>

  <div class="message" id="message">
    点击播放器中的播放按钮即可观看。
  </div>

  <!-- 返回视频收藏馆 -->

  <a
    class="back"
    href="./videos.html"
  >
    ← 返回视频收藏馆
  </a>

  <footer>

    <strong>JIMIN ARCHIVE</strong>

    <div>
      VIDEO COLLECTION · 006
    </div>

    <div>
      收藏那些值得反复观看的瞬间
    </div>

  </footer>

</div>

<script>

const video = document.getElementById("video");
const message = document.getElementById("message");

video.addEventListener("loadedmetadata", function() {

  message.textContent = "视频已加载，点击播放即可观看。";

});

video.addEventListener("error", function() {

  message.textContent =
    "视频加载失败，请检查视频文件名和地址。";

});

</script>

</body>
</html>
